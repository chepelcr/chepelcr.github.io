# Explicit decisions for dependency build scripts (pnpm hardening).
# Without these, pnpm aborts with ERR_PNPM_IGNORED_BUILDS on a fresh install,
# which also breaks `pnpm dev` / `pnpm check` via their dependency-status check.
allowBuilds:
  # Real build tool: needs its postinstall to link the platform binary.
  esbuild: true
  # Optional native perf addon for `ws`; the app works fine without it.
  bufferutil: false
  # Its install script only prints a funding banner.
  core-js: false
